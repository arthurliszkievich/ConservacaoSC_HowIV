<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ acao }} Unidade – Conservação SC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'index' %}">🌿 Conservação SC</a>
      <div class="ms-auto">
        <a href="{% url 'painel' %}" class="btn btn-outline-light btn-sm">← Voltar ao Painel</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">

        <h2 class="fw-bold mb-4">{{ acao }} Unidade de Conservação</h2>

        <div class="card border-0 shadow-sm rounded-4 p-4">
          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {% for field in form %}
              <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                  <div class="form-text">{{ field.help_text }}</div>
                {% endif %}
                {% for error in field.errors %}
                  <div class="text-danger small">⚠ {{ error }}</div>
                {% endfor %}
              </div>
            {% endfor %}

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-success fw-bold px-4">{{ acao }}</button>
              <a href="{% url 'painel' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
