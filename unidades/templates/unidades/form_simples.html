<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo }} – Conservação SC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'index' %}">🌿 Conservação SC</a>
      <div class="ms-auto">
        <a href="{% url voltar %}" class="btn btn-outline-light btn-sm">← Voltar ao Painel</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <h2 class="fw-bold mb-4">{{ titulo }}</h2>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <div class="card border-0 shadow-sm rounded-4 p-4">
          <form method="POST">
            {% csrf_token %}
            {% for field in form %}
              <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                  <div class="text-danger small">⚠ {{ error }}</div>
                {% endfor %}
              </div>
            {% endfor %}
            <div class="d-flex gap-2 mt-3">
              <button type="submit" class="btn btn-success fw-bold px-4">Salvar</button>
              <a href="{% url voltar %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
