<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Exclusão – Conservação SC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
          <div class="mb-3" style="font-size: 3rem;">⚠️</div>
          <h4 class="fw-bold">Confirmar Exclusão</h4>
          <p class="text-muted">
            Você tem certeza que deseja apagar a unidade<br>
            <strong class="text-dark">{{ unidade.nome }}</strong>?
          </p>
          <p class="text-danger small">Esta ação não pode ser desfeita.</p>

          <form method="POST" class="d-flex gap-2 justify-content-center mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger fw-bold px-4">Sim, apagar</button>
            <a href="{% url 'painel' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
