{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Portal de Conservação SC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="auth-logo-area">
      <img src="{% static 'img/bandeira_sc.png' %}" alt="SC" style="width:80px;border-radius:4px;">
      <h2>Portal de Conservação SC</h2>
      <p>Acesse o painel de gestão</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert-success-bar" style="{% if message.tags == 'error' %}background:#fee2e2;border-color:#fca5a5;color:#991b1b;{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" id="form-login">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" name="username" id="username" placeholder="Seu nome de usuário" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" name="password" id="password" placeholder="Sua senha" required>
      </div>
      <button type="submit" class="btn-auth" id="btn-entrar">Entrar</button>
    </form>

    <div class="auth-footer">
      Não tem conta? <a href="{% url 'registro' %}">Cadastre-se aqui</a><br><br>
      <a href="{% url 'index' %}" style="color: var(--gray-400);">← Voltar ao portal</a>
    </div>

  </div>

</body>
</html>
