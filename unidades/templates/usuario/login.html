<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Conservação SC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">

        <div class="text-center mb-4">
          <h2 class="fw-bold text-success">🌿 Conservação SC</h2>
          <p class="text-muted">Acesse sua conta</p>
        </div>

        <div class="card shadow-sm border-0 rounded-4 p-4">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Usuário</label>
              <input type="text" name="username" id="username" class="form-control" placeholder="Seu nome de usuário" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Senha</label>
              <input type="password" name="password" id="password" class="form-control" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Entrar</button>
          </form>

          <hr>
          <p class="text-center mb-0">
            Não tem conta? <a href="{% url 'registro' %}" class="text-success fw-semibold">Cadastre-se aqui</a>
          </p>
        </div>

        <div class="text-center mt-3">
          <a href="{% url 'index' %}" class="text-muted small">← Voltar ao site</a>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
